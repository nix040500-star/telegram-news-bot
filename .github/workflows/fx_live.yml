name: Global FX Brief Bot

on:
  schedule:
    # 한국시간(KST) 기준 매일 00:00 / 06:00 / 12:00 / 18:00
    # GitHub Actions cron은 UTC 기준
    - cron: '0 3,9,15,21 * * *'

  # GitHub에서 필요할 때 수동 실행
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests pytz

      - name: Run Global FX Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python fx_bot.py
