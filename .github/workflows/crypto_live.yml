name: Crypto Live Price Bot

on:
  schedule:
    # 한국시간(KST) 00:00 / 06:00 / 12:00 / 18:00
    # GitHub Actions cron은 UTC 기준이므로
    # UTC 15:00 / 21:00 / 03:00 / 09:00으로 설정
    - cron: '0 3,9,15,21 * * *'

  # GitHub에서 수동 실행 가능
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests pytz

      - name: Run Crypto Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python crypto_bot.py
