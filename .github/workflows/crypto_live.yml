name: Crypto Live Price Bot

on:
  schedule:
    # 한국시간(KST) 기준 00:00 / 06:00 / 12:00 / 18:00
    - cron: '0 0,6,12,18 * * *'
      timezone: 'Asia/Seoul'

  # GitHub에서 수동 실행도 가능
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests pytz

      - name: Run Crypto Bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python crypto_bot.py
