name: Daily News Auto Summary
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-news-bot
  cancel-in-progress: false

jobs:
  run-python-script:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser google-genai
      - name: Run news bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python main.py
      - name: Save duplicate history
        if: always()
        run: |
          if [ -f sent_urls.txt ]; then
            git config user.name "telegram-news-bot"
            git config user.email "actions@users.noreply.github.com"
            git add sent_urls.txt
            if ! git diff --cached --quiet; then
              git commit -m "Update sent news history"
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
